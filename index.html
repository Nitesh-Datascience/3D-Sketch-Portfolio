<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nitesh Kumar | 3D Sketch Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ec;color:#252522;font-family:'Patrick Hand',cursive}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:manipulation}#ui{position:fixed;inset:0;padding:clamp(12px,3vw,28px);display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand,.sound,.hint{background:#fffdf7ed;border:2px solid #252522;box-shadow:4px 4px #252522}.brand{padding:8px 16px;font:700 clamp(22px,3vw,34px) 'Caveat'}.brand small{display:block;font:14px 'Patrick Hand';letter-spacing:1px}.sound{pointer-events:auto;padding:8px 12px;font:17px 'Patrick Hand';cursor:pointer}.hint{align-self:center;padding:10px 16px;text-align:center;font-size:clamp(16px,2vw,21px)}#modal{display:none;position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 28px));max-height:80vh;overflow:auto;background:#fffdf7;border:3px solid #252522;box-shadow:9px 9px #252522;padding:clamp(18px,4vw,32px)}#modal h2{font:700 clamp(32px,6vw,46px) 'Caveat';margin:0 0 8px}#modal p{font-size:20px;line-height:1.45}#links{display:grid;gap:9px;margin:18px 0}#modal a,#modal button{font:18px 'Patrick Hand';color:#252522;background:#f1e8d4;border:2px solid #252522;padding:8px 14px;text-decoration:none;cursor:pointer}#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#f7f4ec;font:28px 'Caveat';transition:opacity .4s}#loading.hide{opacity:0;pointer-events:none}@media(max-width:600px){.brand{padding:6px 10px}.brand small{font-size:12px}.sound{font-size:15px;padding:7px 9px}}
</style></head><body><div id="loading">Sketching your portfolio…</div><div id="scene"></div>
<div id="ui"><div class="top"><div class="brand">NITESH KUMAR<small>CREATIVE • DATA • CODE</small></div><button class="sound" id="sound">🔊 Sound: play sketch tone</button></div><div class="hint" id="hint">✎ Click or tap the entrance door to begin</div></div>
<section id="modal" role="dialog" aria-modal="true"><h2 id="title"></h2><p id="description"></p><div id="links"></div><button id="back">← Back to hallway</button></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
<script>
(()=>{const host=document.getElementById('scene'),hint=document.getElementById('hint'),modal=document.getElementById('modal');if(!window.THREE||!window.TWEEN){document.getElementById('loading').textContent='Three.js failed to load. Check internet and refresh.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color('#f7f4ec');scene.fog=new THREE.Fog('#f7f4ec',24,58);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);camera.position.set(0,1.7,10);camera.lookAt(0,2,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0xb8b1a3,1.5));const light=new THREE.DirectionalLight(0xffffff,.8);light.position.set(-4,8,8);scene.add(light);const clickable=[];
function mat(label,color){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle=color;g.fillRect(0,0,512,512);for(let i=0;i<600;i++){g.globalAlpha=Math.random()*.07;g.strokeStyle=i%2?'#5e594f':'#fff';g.beginPath();let x=Math.random()*512,y=Math.random()*512;g.moveTo(x,y);g.lineTo(x+Math.random()*20,y+Math.random()*2);g.stroke()}g.globalAlpha=1;g.strokeStyle='#252522';g.lineWidth=6;g.strokeRect(12,12,488,488);g.lineWidth=2;g.strokeRect(23,23,466,466);if(label){g.fillStyle='#252522';g.textAlign='center';g.textBaseline='middle';g.font='bold 60px Caveat';label.split('\n').forEach((s,i,a)=>g.fillText(s,256,256+(i-(a.length-1)/2)*68,430))}const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return new THREE.MeshStandardMaterial({map:t,roughness:1,side:THREE.DoubleSide})}
function box(w,h,d,m,x,y,z,ry=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.rotation.y=ry;scene.add(o);return o}
box(13,.12,56,mat('','#f8f5ed'),0,-.1,-15);box(13,.12,56,mat('','#f0ede5'),0,6,-15);box(.15,6,56,mat('','#f4f1e9'),-6.45,3,-15);box(.15,6,56,mat('','#f4f1e9'),6.45,3,-15);box(4.4,6,.25,mat('WELCOME','#f1ede3'),-4.25,3,4.5);box(4.4,6,.25,mat('','#f1ede3'),4.25,3,4.5);box(4,1.4,.25,mat('NITESH KUMAR','#fffdf7'),0,5.3,4.5);
const hinge=new THREE.Group();hinge.position.set(-1.5,0,4.35);scene.add(hinge);const front=new THREE.Mesh(new THREE.BoxGeometry(3,4.5,.16),mat('PORTFOLIO\nENTER','#e8e0d1'));front.position.set(1.5,2.25,0);hinge.add(front);let entered=false,busy=false;front.userData.action=enter;clickable.push(front);
function door(x,z,rot,label,title,desc,items){const gr=new THREE.Group();gr.position.set(x,0,z);gr.rotation.y=rot;scene.add(gr);const frame=new THREE.Mesh(new THREE.BoxGeometry(2.35,4.25,.22),mat('','#d8d0c0'));frame.position.y=2.12;gr.add(frame);const panel=new THREE.Mesh(new THREE.BoxGeometry(1.95,3.85,.13),mat(label,'#fffdf7'));panel.position.set(0,2.05,-.16);gr.add(panel);panel.userData.action=()=>show(title,desc,items);frame.userData.action=panel.userData.action;clickable.push(panel,frame)}
door(-6.28,-5,Math.PI/2,'THE\nGALLERY','The Gallery','A selection of projects, experiments and data stories.',[['Telecom Churn Analysis','#'],['Nifty Prediction','#'],['Smart Water Tank Monitoring','#']]);door(6.28,-11,-Math.PI/2,'THE\nSTUDIO','The Studio','Explore my code, creative experiments and professional profile.',[['GitHub · Nitesh-Datascience','https://github.com/Nitesh-Datascience'],['LinkedIn','https://www.linkedin.com/']]);door(-6.28,-18,Math.PI/2,'RESUME','Resume','BCA graduate and aspiring data analyst, exploring Python, data science and interactive web experiences.',[['GitHub profile','https://github.com/Nitesh-Datascience']]);door(0,-29,0,'ABOUT\nME','About Nitesh','Hi, I’m Nitesh Kumar. I enjoy building data projects and playful digital experiences using code.',[]);
for(let z=-3;z>-27;z-=5){box(1.4,1.4,.06,mat('✎','#fffdf7'),-6.32,4.8,z,Math.PI/2);box(1.4,1.4,.06,mat('✧','#fffdf7'),6.32,4.8,z,-Math.PI/2)}
function move(pos,dur,done){busy=true;new TWEEN.Tween(camera.position).to(pos,dur).easing(TWEEN.Easing.Cubic.InOut).onComplete(()=>{busy=false;if(done)done()}).start()}
function enter(){if(entered||busy)return;entered=true;hint.textContent='✎ Click a hallway door to explore · drag to look around';new TWEEN.Tween(hinge.rotation).to({y:-Math.PI/2},850).easing(TWEEN.Easing.Cubic.Out).start();move({x:0,y:1.7,z:-2},1600,()=>camera.lookAt(0,2,-9))}
function show(t,d,items){document.getElementById('title').textContent=t;document.getElementById('description').textContent=d;const list=document.getElementById('links');list.replaceChildren();items.forEach(it=>{const a=document.createElement('a');a.textContent='↗ '+it[0];a.href=it[1];if(it[1]==='#'){a.addEventListener('click',e=>{e.preventDefault();a.textContent='Add the real project URL in index.html'})}else{a.target='_blank';a.rel='noopener noreferrer'}list.appendChild(a)});modal.style.display='block'}
document.getElementById('back').onclick=()=>modal.style.display='none';const ray=new THREE.Raycaster(),p=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(modal.style.display==='block')return;const r=renderer.domElement.getBoundingClientRect();p.x=(e.clientX-r.left)/r.width*2-1;p.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(p,camera);const hits=ray.intersectObjects(clickable,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData.action)o=o.parent;if(o&&o.userData.action)o.userData.action()}});
let last=null,drag=false;renderer.domElement.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY};drag=false});renderer.domElement.addEventListener('pointermove',e=>{if(!last||!entered||busy||modal.style.display==='block')return;let dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>5)drag=true;if(drag){camera.rotation.y-=dx*.002;camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x-dy*.001,-.22,.22)}last={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>{last=null;setTimeout(()=>drag=false,0)});
let pinch=0,fov=camera.fov;renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);fov=camera.fov}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);camera.fov=THREE.MathUtils.clamp(fov*pinch/d,38,75);camera.updateProjectionMatrix()}},{passive:true});
document.getElementById('sound').onclick=()=>{try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=440;g.gain.value=.02;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.15);o.stop(ac.currentTime+.16);document.getElementById('sound').textContent='🔊 Sound played'}catch(e){document.getElementById('sound').textContent='Audio unavailable'}};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(t){requestAnimationFrame(animate);TWEEN.update(t);if(!entered&&!busy){camera.position.y=1.7+Math.sin(t*.0014)*.025;camera.lookAt(0,2,2)}renderer.render(scene,camera)}requestAnimationFrame(animate);setTimeout(()=>document.getElementById('loading').classList.add('hide'),500)
})();
</script></body></html>
